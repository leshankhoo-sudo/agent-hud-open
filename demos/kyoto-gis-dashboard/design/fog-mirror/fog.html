<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fog mirror sample</title>
<!-- sample only: in the site the chosen script font is subset to the letters of "Group 4" and served locally -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Mrs+Saint+Delafield&family=Sacramento&display=swap" rel="stylesheet">
<style>
  :root { --bg: #07080f; --ez: cubic-bezier(.2, .8, .2, 1); }
  html, body { margin: 0; background: var(--bg); color: #fff; font: 14px/1.4 system-ui, 'Segoe UI', sans-serif; }
  .outro { position: relative; padding: 5vh 3vw 4vh; background: radial-gradient(90% 70% at 50% 0%, #11264f 0%, var(--bg) 70%); }
  .outro-frame { position: relative; aspect-ratio: 16 / 9; max-height: 88vh; margin: 0 auto; display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; border-radius: 18px; overflow: hidden; }
  .op { position: relative; overflow: hidden; border-radius: 12px; }
  .op canvas { width: 100%; height: 100%; display: block; background: url(../../public/media/ending_quad.jpg) 0 0 / 400% 100%; }
  .op::after { content: ''; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(5, 11, 24, .1) 40%, rgba(5, 11, 24, .82)); }

  /* the card: one box, two faces. The flip is done in two halves (front turns to its edge, the back turns in
     from its edge) so the glass blur of the front keeps working and nothing shows through backwards. */
  .card { position: absolute; left: 50%; top: 42%; translate: -50% -50%; width: min(560px, 86%); perspective: 1400px; }
  .turner { position: relative; transform-style: flat; will-change: transform; }
  .face { border-radius: 18px; }
  .front { text-align: center; padding: 26px 28px; background: linear-gradient(150deg, rgba(40, 18, 46, .55), rgba(10, 14, 36, .68)); backdrop-filter: blur(16px) saturate(1.3); border: 1px solid rgba(255, 210, 228, .28); }
  .front h2 { font: 600 clamp(22px, 2.4vw, 34px)/1.15 system-ui, sans-serif; margin: 0 0 14px; }
  .eb, .by { margin: 0 0 10px; font: 500 11px ui-monospace, Consolas, monospace; letter-spacing: .3em; text-transform: uppercase; color: rgba(255, 255, 255, .7); }
  .eb { color: #ffd7e4; }
  .team { list-style: none; margin: 0 0 16px; padding: 0; display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; }
  .team li { font: 600 13px system-ui, sans-serif; letter-spacing: .08em; padding: 7px 14px; border-radius: 999px; background: rgba(255, 255, 255, .08); border: 1px solid rgba(255, 215, 228, .3); }
  .src { margin: 0 0 14px; font-size: 11.5px; color: rgba(255, 255, 255, .62); }
  .skip { font: 600 13px system-ui; color: #fff; background: rgba(255, 255, 255, .1); border: 1px solid rgba(255, 255, 255, .3); border-radius: 999px; padding: 8px 16px; }
  .flip-btn { position: absolute; top: 10px; right: 10px; z-index: 2; display: inline-flex; align-items: center; gap: 6px; font: 600 11px ui-monospace, Consolas, monospace; letter-spacing: .12em; text-transform: uppercase; color: rgba(255, 255, 255, .85); background: rgba(255, 255, 255, .08); border: 1px solid rgba(255, 215, 228, .32); border-radius: 999px; padding: 6px 11px; cursor: pointer; transition: background .2s; }
  .flip-btn:hover { background: rgba(255, 255, 255, .18); }
  .flip-btn svg { width: 13px; height: 13px; }

  /* the back: a fogged mirror. The canvas draws the panels behind the card, blurred and washed white; the
     writing clears the fog so the panels show through sharp. */
  .back { position: absolute; inset: 0; overflow: hidden; border: 1px solid rgba(255, 255, 255, .45); box-shadow: inset 0 0 0 1px rgba(255, 255, 255, .25), inset 0 0 40px rgba(255, 255, 255, .25), 0 18px 50px rgba(0, 0, 0, .35); visibility: hidden; }
  .back canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  .back .flip-btn { color: rgba(30, 40, 60, .8); background: rgba(255, 255, 255, .45); border-color: rgba(255, 255, 255, .7); }
  .card.flipped .front { visibility: hidden; }
  .card.flipped .back { visibility: visible; }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }

  /* sample controls (not part of the site) */
  .controls { max-width: 900px; margin: 18px auto 0; display: flex; flex-wrap: wrap; gap: 10px 18px; align-items: center; justify-content: center; color: #b9c2d8; font-size: 13px; }
  .controls select, .controls button { font: inherit; color: #fff; background: #18203a; border: 1px solid #34406a; border-radius: 8px; padding: 5px 9px; }
</style>
</head>
<body>
<section class="outro">
  <video id="v" muted loop playsinline preload="auto" src="../../public/media/ending_quad.mp4" style="display:none"></video>
  <div class="outro-frame" id="frame">
    <div class="op"><canvas></canvas></div><div class="op"><canvas></canvas></div><div class="op"><canvas></canvas></div><div class="op"><canvas></canvas></div>
    <div class="card" id="card">
      <div class="turner" id="turner">
        <div class="face front">
          <button type="button" class="flip-btn" data-flip aria-label="Turn the card over"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M13.5 6.5A5.5 5.5 0 0 0 3.2 4.6M2.5 9.5a5.5 5.5 0 0 0 10.3 1.9"/><path d="M3 2v3h3M13 14v-3h-3"/></svg>Turn over</button>
          <p class="eb">THANK YOU · ありがとう</p>
          <h2>Kyoto Prefecture Travel Atlas</h2>
          <p class="by">Prepared by</p>
          <ul class="team"><li>KHOO LE SHAN</li><li>ER ZE XI</li><li>NICHOLAS LIM JUN XIAN</li><li>LUI YING HUI</li></ul>
          <p class="src">Data: OpenStreetMap contributors (ODbL), MLIT N03 2026, Kyoto City Transportation Bureau, Open-Meteo, Wikimedia Commons</p>
          <button type="button" class="skip">Back to the start ↑</button>
        </div>
        <div class="face back" aria-hidden="true">
          <canvas id="mirror"></canvas>
          <span class="sr">Group 4</span>
          <button type="button" class="flip-btn" data-flip aria-label="Turn the card back"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M13.5 6.5A5.5 5.5 0 0 0 3.2 4.6M2.5 9.5a5.5 5.5 0 0 0 10.3 1.9"/><path d="M3 2v3h3M13 14v-3h-3"/></svg>Turn back</button>
        </div>
      </div>
    </div>
  </div>
  <div class="controls">
    <label>Script <select id="font"><option>Great Vibes</option><option>Mrs Saint Delafield</option><option>Sacramento</option></select></label>
    <label><input type="checkbox" id="refog" checked> Fog slowly comes back, then it is written again</label>
    <button type="button" id="again">Write again</button>
  </div>
</section>
<script>
const $ = (s) => document.querySelector(s);
const video = $('#v'), frame = $('#frame'), card = $('#card'), turner = $('#turner');
const panels = [...document.querySelectorAll('.op canvas')];
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;

// ---- the panels: one quarter of the video each (as in Outro.jsx) ----
video.play().catch(() => {});
function drawPanels() {
  if (video.readyState >= 2) {
    const qw = video.videoWidth / 4, h = video.videoHeight;
    panels.forEach((c, i) => { if (c.width !== qw) { c.width = qw; c.height = h; } c.getContext('2d').drawImage(video, qw * i, 0, qw, h, 0, 0, qw, h); });
  }
}

// ---- the flip: front turns to its edge, the back turns in from the other edge ----
let flipped = false, busy = false;
function flip() {
  if (busy) return; busy = true;
  const to = !flipped;
  const half = (from, toDeg, ease, ms) => turner.animate([{ transform: `rotateY(${from}deg) scale(${from ? .96 : 1})` }, { transform: `rotateY(${toDeg}deg) scale(${toDeg ? .96 : 1})` }], { duration: reduce ? 1 : ms, easing: ease, fill: 'forwards' }).finished;
  const dir = to ? 1 : -1;
  half(0, 90 * dir, 'cubic-bezier(.5,0,.9,.4)', 320).then(() => {
    flipped = to; card.classList.toggle('flipped', to);
    if (to) startMirror(); else stopMirror();
    return half(-90 * dir, 0, 'cubic-bezier(.15,.7,.25,1)', 520);
  }).then(() => { busy = false; const b = document.querySelector(to ? '.back .flip-btn' : '.front .flip-btn'); b && b.focus({ preventScroll: true }); });
}
document.querySelectorAll('[data-flip]').forEach((b) => b.addEventListener('click', flip));
// the back face takes the front's size
new ResizeObserver(() => { $('.back').style.height = $('.front').offsetHeight + 'px'; }).observe($('.front'));

// ---- the fog mirror ----
const cv = $('#mirror'), ctx = cv.getContext('2d');
const mk = (w, h) => { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; };
let W = 0, H = 0, DPR = 1, small, fog, mask, ink, grain, drops = [], raf = 0, t0 = 0, running = false, writeAt = 0, fontName = 'Great Vibes';
const WRITE_MS = 3600;          // how long "Group 4" takes to appear
const HOLD_MS = 14000;          // then it stays this long before the fog creeps back (if re-fog is on)
const REFOG_MS = 6000;

function size() {
  // the layout size, not the on-screen box: mid-flip the card is turned edge-on
  DPR = Math.min(2, devicePixelRatio || 1);
  W = Math.round(cv.offsetWidth * DPR); H = Math.round(cv.offsetHeight * DPR);
  if (!W || !H) return;
  cv.width = W; cv.height = H;
  small = mk(Math.max(8, Math.round(W / 14)), Math.max(6, Math.round(H / 14)));   // drawn small then stretched = a cheap strong blur
  fog = mk(W, H); mask = mk(W, H);
  // grain: fine speckle that makes the white look like condensation, not paint
  grain = mk(256, 256); const g = grain.getContext('2d'), id = g.createImageData(256, 256);
  for (let i = 0; i < id.data.length; i += 4) { const v = 200 + Math.random() * 55; id.data[i] = id.data[i + 1] = id.data[i + 2] = v; id.data[i + 3] = Math.random() * 60; }
  g.putImageData(id, 0, 0);
  // tiny condensation beads scattered over the glass
  beads = Array.from({ length: Math.round(W * H / 2600) }, () => ({ x: Math.random() * W, y: Math.random() * H, r: (Math.random() ** 2.4) * 2.6 * DPR + .5 * DPR }));
  makeInk();
}
let beads = [];
// the words, drawn once into an offscreen canvas; the reveal uncovers it from left to right
function makeInk() {
  ink = mk(W, H); const g = ink.getContext('2d');
  let fs = H * 0.46; g.font = `${fs}px "${fontName}"`;
  const tw = g.measureText('Group 4').width; if (tw > W * 0.82) { fs *= W * 0.82 / tw; g.font = `${fs}px "${fontName}"`; }
  g.textAlign = 'center'; g.textBaseline = 'middle';
  g.lineJoin = 'round'; g.lineWidth = fs * 0.07; g.strokeStyle = g.fillStyle = '#fff';
  g.fillText('Group 4', W / 2, H * 0.5); g.strokeText('Group 4', W / 2, H * 0.5);   // a finger is wider than a pen: thicken the letters
  // where drips may start: the low points of the letters
  const d = g.getImageData(0, 0, W, H).data; const cols = [];
  for (let x = Math.round(W * .15); x < W * .85; x += Math.round(W / 40)) { for (let y = H - 1; y > 0; y--) if (d[(y * W + x) * 4 + 3] > 200) { cols.push({ x, y }); break; } }
  ink.lows = cols.sort((a, b) => b.y - a.y);
  const xs = []; for (let x = 0; x < W; x++) for (let y = 0; y < H; y += 3) if (d[(y * W + x) * 4 + 3] > 0) { xs.push(x); break; }
  ink.x0 = xs[0] || W * .1; ink.x1 = xs[xs.length - 1] || W * .9;
}

function startMirror() { size(); running = true; t0 = performance.now(); writeAt = t0 + (reduce ? -WRITE_MS : 700); drops = []; mask.getContext('2d').clearRect(0, 0, W, H); if (!raf) raf = requestAnimationFrame(tick); }
function stopMirror() { running = false; }

// one frame: sharp panels, then fog with the writing cut out of it, then beads and drips on top
function sharpBehind(g, w, h) {
  g.fillStyle = '#0b1022'; g.fillRect(0, 0, w, h);
  const cr = card.getBoundingClientRect(), sx = w / cr.width, sy = h / cr.height;   // the card box is never turned, only its inside
  panels.forEach((c) => {
    if (!c.width) return;
    const pr = c.getBoundingClientRect();
    g.drawImage(c, (pr.left - cr.left) * sx, (pr.top - cr.top) * sy, pr.width * sx, pr.height * sy);
  });
}
function tick(now) {
  raf = 0;
  drawPanels();
  if (!running || !W) { if (running) raf = requestAnimationFrame(tick); return; }
  const t = now - t0;
  sharpBehind(ctx, W, H);
  // the writing: a soft-edged wipe that moves along the words, the way a fingertip would
  const m = mask.getContext('2d');
  const p = Math.min(1, Math.max(0, (now - writeAt) / WRITE_MS));
  const e = p < .5 ? 2 * p * p : 1 - (-2 * p + 2) ** 2 / 2;   // slow start, slow finish
  const lead = ink.x0 + (ink.x1 - ink.x0 + 40 * DPR) * e;
  m.clearRect(0, 0, W, H);
  if (p > 0) {
    m.save(); m.filter = `blur(${1.6 * DPR}px)`;
    m.drawImage(ink, 0, 0);
    m.restore();
    m.globalCompositeOperation = 'destination-in';   // the leading edge leans like the script
    const gr = m.createLinearGradient(lead - 46 * DPR, H / 2 + 17 * DPR, lead, H / 2); gr.addColorStop(0, '#000'); gr.addColorStop(1, 'rgba(0,0,0,0)');
    m.fillStyle = gr; m.fillRect(0, 0, W, H);
    m.globalCompositeOperation = 'source-over';
  }
  // drips: once a stretch of the words is written, a few beads run down from the lowest points
  if (p > .35 && drops.length < 3 && ink.lows.length) {
    const c = ink.lows[[1, 4, 7][drops.length] % ink.lows.length];
    if (c.x < lead - 30 * DPR) drops.push({ x: c.x + (Math.random() - .5) * 6 * DPR, y: c.y - 4 * DPR, v: 0, born: now, r: (2.2 + Math.random()) * DPR, stop: c.y + H * (.12 + Math.random() * .22) });
  }
  drops.forEach((d) => {
    if (d.y < d.stop) { d.v = Math.min(d.v + .0009 * DPR, .07 * DPR); d.y += d.v * 16 + (Math.random() < .03 ? 2 * DPR : 0); d.x += (Math.random() - .5) * .35 * DPR; }
    (d.trail || (d.trail = [])).push([d.x, d.y]);
  });
  m.lineCap = 'round';
  drops.forEach((d) => { m.beginPath(); d.trail.forEach(([x, y], i) => (i ? m.lineTo(x, y) : m.moveTo(x, y))); m.lineWidth = d.r * 1.3; m.strokeStyle = 'rgba(0,0,0,.85)'; m.stroke(); });
  // the fog creeping back over the writing (optional)
  let refog = 0;
  if ($('#refog').checked && p >= 1) {
    const since = now - writeAt - WRITE_MS - HOLD_MS;
    refog = Math.min(1, Math.max(0, since / REFOG_MS));
    if (refog >= 1) { writeAt = now + 1200; drops = []; }
  }
  // the fog itself
  const f = fog.getContext('2d');
  const sg = small.getContext('2d'); sharpBehind(sg, small.width, small.height);
  f.globalCompositeOperation = 'source-over'; f.globalAlpha = 1;
  f.imageSmoothingQuality = 'high'; f.drawImage(small, 0, 0, W, H);
  f.fillStyle = 'rgba(226, 233, 242, .58)'; f.fillRect(0, 0, W, H);            // the white breath on the glass
  // slow drifting thicker patches, so the fog is never flat
  for (let k = 0; k < 4; k++) {
    const a = t / 9000 + k * 1.7, x = W * (.5 + .45 * Math.sin(a * (1 + k * .13))), y = H * (.5 + .4 * Math.cos(a * .8 + k));
    const rg = f.createRadialGradient(x, y, 0, x, y, W * .38);
    rg.addColorStop(0, 'rgba(244, 247, 251, .34)'); rg.addColorStop(1, 'rgba(244, 247, 251, 0)');
    f.fillStyle = rg; f.fillRect(0, 0, W, H);
  }
  f.globalAlpha = .55; f.fillStyle = f.createPattern(grain, 'repeat'); f.fillRect(0, 0, W, H); f.globalAlpha = 1;
  // tiny condensation beads on the glass (part of the fog, so the writing wipes them away too)
  beads.forEach((b) => { f.globalAlpha = .6; f.fillStyle = '#fff'; f.beginPath(); f.arc(b.x, b.y, b.r, 0, 7); f.fill(); f.globalAlpha = .3; f.fillStyle = 'rgb(70,80,100)'; f.beginPath(); f.arc(b.x + b.r * .35, b.y + b.r * .4, b.r * .5, 0, 7); f.fill(); });
  f.globalAlpha = 1;
  // cut the writing out of the fog; what is cleared is still a little misty at the edges
  f.globalCompositeOperation = 'destination-out'; f.globalAlpha = .93 * (1 - refog); f.drawImage(mask, 0, 0);
  f.globalCompositeOperation = 'source-over'; f.globalAlpha = 1;
  ctx.drawImage(fog, 0, 0);
  // a faint wet rim along the cleared strokes
  ctx.save(); ctx.globalAlpha = .18 * (1 - refog); ctx.filter = `blur(${2.5 * DPR}px)`; ctx.globalCompositeOperation = 'screen'; ctx.drawImage(mask, -1 * DPR, -1.5 * DPR); ctx.restore();
  // the running drops' heads
  drops.forEach((d) => { const rg = ctx.createRadialGradient(d.x - d.r * .3, d.y - d.r * .4, 0, d.x, d.y, d.r * 1.4); rg.addColorStop(0, 'rgba(255,255,255,.95)'); rg.addColorStop(.5, 'rgba(220,230,245,.5)'); rg.addColorStop(1, 'rgba(40,50,70,.25)'); ctx.fillStyle = rg; ctx.beginPath(); ctx.ellipse(d.x, d.y, d.r, d.r * 1.25, 0, 0, 7); ctx.fill(); });
  raf = requestAnimationFrame(tick);
}
(function idle() { if (!running) drawPanels(); requestAnimationFrame(idle); })();

$('#font').addEventListener('change', (e) => { fontName = e.target.value; document.fonts.load(`40px "${fontName}"`).then(() => { if (running) startMirror(); }); });
$('#again').addEventListener('click', () => { if (!flipped) flip(); else startMirror(); });
document.fonts.load('40px "Great Vibes"');
</script>
</body>
</html>
