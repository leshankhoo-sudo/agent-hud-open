<title>Dashboard Interaction</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;700&family=Newsreader:opsz,wght@6..72,400;6..72,500&family=Noto+Sans+SC:wght@400;500;700;900&display=swap">
<style>
/* Layout: full-bleed ocean hero (scroll cover) → a 720×1280 stage, scaled to fit, that replays the six dashboard chapters plus the conic-glow scene.
   Deliberately a single dark look (a replica of the reference recordings). */
:root{
  --acc:#ff9500; --ink:#f3f3f1; --navy:#13284a;
  --ez:cubic-bezier(.2,.8,.2,1);
  --f-ui:'Inter','Noto Sans SC','PingFang SC','Microsoft YaHei',system-ui,sans-serif;
  --f-cn:'Noto Sans SC','PingFang SC','Microsoft YaHei','Inter',sans-serif;
  --f-mono:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
  --f-disp:'Archivo Black','Inter','Noto Sans SC',sans-serif;
  --f-serif:'Newsreader','Iowan Old Style','Times New Roman',Georgia,serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:#0b0b0c;color:var(--ink);font-family:var(--f-ui);overflow-x:hidden;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}
button:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.sp{flex:1}
.ic{flex:none;display:block}
@keyframes blink{50%{opacity:0}}

/* ================= Hero (ocean cover) ================= */
.hero{position:relative;height:100svh;min-height:520px;overflow:hidden;container-type:inline-size;background:#5c7fa3 url(media/ocean-poster.jpg) 62% 50%/cover no-repeat}
.hero video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:62% 50%}
.hin{position:absolute;inset:0;--u:max(calc(100cqw / 876),1px);color:var(--navy)}
.hband{position:absolute;left:0;right:0;top:0;height:max(calc(20*var(--u)),26px);background:rgba(26,38,60,.32);display:flex;align-items:center;justify-content:center;gap:8px;font:500 max(calc(7*var(--u)),10.5px)/1 var(--f-ui);color:#eef3fb;letter-spacing:.02em;text-decoration:none}
.hnav{position:absolute;top:max(calc(28*var(--u)),36px);left:max(calc(36*var(--u)),16px);right:max(calc(35*var(--u)),16px);height:max(calc(25*var(--u)),34px);display:flex;align-items:center}
.hlogo{display:flex;align-items:center;gap:calc(10*var(--u));font:600 max(calc(8.4*var(--u)),11px)/1 var(--f-ui);letter-spacing:.34em;color:#1b2b48;text-decoration:none}
.hlogo svg{width:max(calc(25*var(--u)),24px);height:auto}
.hlinks{position:absolute;left:calc(326*var(--u));display:flex;gap:calc(28*var(--u));font:500 max(calc(7.8*var(--u)),11px)/1 var(--f-ui)}
.hlinks a{color:#1b2b48;text-decoration:none}
.hlinks a:hover,.hcta:hover{opacity:.75}
.hcta{margin-left:auto;height:100%;padding:0 max(calc(13*var(--u)),14px);border:1px solid rgba(19,40,74,.72);border-radius:999px;display:flex;align-items:center;gap:6px;font:500 max(calc(7.5*var(--u)),11px)/1 var(--f-ui);color:var(--navy);text-decoration:none;background:rgba(255,255,255,.04)}
.hcta svg{width:max(calc(8*var(--u)),11px)}
.heb{position:absolute;left:max(calc(56*var(--u)),18px);top:max(calc(108*var(--u)),104px);font:600 max(calc(6.3*var(--u)),9px)/1 var(--f-ui);letter-spacing:.36em;color:#1d3157}
.hh1{position:absolute;left:max(calc(53*var(--u)),16px);top:max(calc(119*var(--u)),118px);margin:0;font:400 max(calc(57*var(--u)),50px)/.9 var(--f-serif);letter-spacing:-.012em;color:#0f2546}
.hsub{position:absolute;left:max(calc(56*var(--u)),18px);top:max(calc(231*var(--u)),232px);margin:0;font:400 max(calc(11.6*var(--u)),14px)/1.36 var(--f-ui);color:#22324f}
.hbtns{position:absolute;left:max(calc(56*var(--u)),18px);top:max(calc(277*var(--u)),290px);display:flex;align-items:center;gap:max(calc(16*var(--u)),14px)}
.hb1{height:max(calc(25*var(--u)),38px);padding:0 max(calc(17*var(--u)),18px);border-radius:999px;background:#112548;color:#fff;border:0;display:flex;align-items:center;gap:8px;font:500 max(calc(7.6*var(--u)),12px)/1 var(--f-ui);cursor:pointer;text-decoration:none}
.hb1 svg{width:max(calc(8*var(--u)),12px)}
.hb2{display:flex;align-items:center;gap:max(calc(9*var(--u)),9px);background:none;border:0;padding:0;cursor:pointer;font:500 max(calc(7.6*var(--u)),12px)/1 var(--f-ui);color:var(--navy)}
.hb2 i{width:max(calc(25*var(--u)),36px);height:max(calc(25*var(--u)),36px);border-radius:50%;border:1.2px solid rgba(19,40,74,.8);display:grid;place-items:center}
.hb2 svg{width:max(calc(8*var(--u)),11px)}
.hbl{position:absolute;left:max(calc(27*var(--u)),16px);bottom:max(calc(18*var(--u)),18px);display:flex;align-items:center;gap:max(calc(11*var(--u)),10px);font:500 max(calc(6.5*var(--u)),9.5px)/1 var(--f-ui);letter-spacing:.32em;color:#f2f5fa}
.hbl button{width:max(calc(21*var(--u)),30px);height:max(calc(21*var(--u)),30px);border-radius:50%;border:1px solid rgba(255,255,255,.78);background:none;display:grid;place-items:center;cursor:pointer;padding:0;color:#fff}
.hbl svg{width:max(calc(7*var(--u)),10px)}
.hbr{position:absolute;right:max(calc(26*var(--u)),16px);bottom:max(calc(22*var(--u)),24px);display:flex;align-items:center;gap:max(calc(9*var(--u)),8px);font:500 max(calc(6*var(--u)),9.5px)/1 var(--f-ui);letter-spacing:.32em;color:#f2f5fa;text-decoration:none}
.hbr svg{width:max(calc(8*var(--u)),11px);animation:nudge 2.2s ease-in-out infinite}
@keyframes nudge{0%,100%{transform:none}50%{transform:translateY(3px)}}
@media (max-width:720px){.hlinks{display:none}}

/* ================= Deck section ================= */
.deck{position:relative;height:100svh;min-height:560px;background:#000;display:flex;align-items:flex-start;justify-content:center;overflow:hidden;padding-top:6px}
.swrap{position:relative;flex:none}
.stage{position:absolute;left:0;top:0;width:720px;height:1280px;transform-origin:0 0;overflow:hidden;background:#1c1c1e;font-family:var(--f-ui);color:var(--ink)}
.scene{position:absolute;inset:0;overflow:hidden;transition:transform .5s cubic-bezier(.65,0,.35,1)}
.scene.notr{transition:none}
.scene.gone{visibility:hidden}
.sbg{position:absolute;inset:-24px;background-size:cover;background-position:center;animation:drift 28s ease-in-out infinite alternate}
@keyframes drift{from{transform:scale(1.02)}to{transform:scale(1.08) translate(-10px,8px)}}
.prog{position:absolute;left:4px;right:4px;top:58px;display:flex;gap:8px}
.prog i{flex:1;height:4px;border-radius:2px;background:rgba(255,255,255,.17)}
.prog i.d{background:rgba(255,255,255,.44)}
.prog i.c{background:var(--acc)}
.sbar{position:absolute;right:6px;top:116px;width:4px;height:122px;border-radius:2px;background:rgba(255,255,255,.3)}
.hbadge{position:absolute;left:3px;top:86px;width:40px;height:40px;border-radius:8px;background:var(--acc);color:#141414;font:800 22px/40px var(--f-ui);text-align:center;letter-spacing:-.5px;transform-origin:0 0;transition:transform .55s cubic-bezier(.6,0,.2,1),opacity .3s}
.htext{position:absolute;left:60px;top:80px;transform-origin:0 0;transition:transform .55s cubic-bezier(.6,0,.2,1),clip-path .5s var(--ez);clip-path:inset(-10px -10px -10px -10px)}
.htext h2{margin:0;font:700 28px/1.2 var(--f-cn);letter-spacing:.5px;color:#fff;white-space:nowrap}
.htext small{display:block;margin-top:4px;font:500 14px/1 var(--f-mono);letter-spacing:.38em;color:#b8b8b8;white-space:nowrap}
.scene.pre .hbadge{transform:translate(-1px,256px) scale(4.55)}
.scene.pre .htext{transform:translate(152px,325px) scale(1.72)}
.scene.pre.t0 .hbadge{opacity:0;transform:translate(20px,276px) scale(3.6)}
.scene.pre.t0 .htext{clip-path:inset(-10px 100% -10px -10px)}
.hud{position:absolute;left:570px;top:72px;width:142px;border-radius:12px;background:rgba(14,14,16,.82);padding:11px 11px 12px;display:grid;grid-template-columns:auto 1fr;row-gap:5px;font:700 12.5px/1.2 var(--f-mono);letter-spacing:.12em;font-variant-numeric:tabular-nums;transition:opacity .45s .25s}
.hud .k{color:#6f6f70;transition:color .4s}
.hud .v{color:#e9e9e7;text-align:right;white-space:nowrap;letter-spacing:.04em;transition:color .4s}
.hud.hot .k,.hud.hot .v{color:var(--acc)}
.scene.pre .hud{opacity:0;transition:opacity .2s}
.dash{position:absolute;left:2px;top:234px;width:716px;height:464px;transition:transform .65s cubic-bezier(.3,.75,.2,1),opacity .45s}
.scene.pre .dash{opacity:0;transform:translateY(270px)}
.canvas{position:absolute;left:0;top:0;transform-origin:0 0;transform:scale(.662963)}
.br{position:absolute;width:15px;height:15px;border:0 solid rgba(170,170,170,.7);z-index:8;pointer-events:none}
.br.tl{left:10px;top:10px;border-left-width:1.5px;border-top-width:1.5px}
.br.tr{right:10px;top:10px;border-right-width:1.5px;border-top-width:1.5px}
.br.bl{left:10px;bottom:10px;border-left-width:1.5px;border-bottom-width:1.5px}
.br.bx{right:10px;bottom:10px;border-right-width:1.5px;border-bottom-width:1.5px}
.ruler{position:absolute;left:28px;right:28px;bottom:12px;height:9px;z-index:8;pointer-events:none;
  background:repeating-linear-gradient(90deg,rgba(160,160,160,.5) 0 1px,transparent 1px 50px) bottom/100% 9px no-repeat,repeating-linear-gradient(90deg,rgba(160,160,160,.25) 0 1px,transparent 1px 10px) bottom/100% 5px no-repeat}
.ruler::after{content:"";position:absolute;bottom:0;width:2px;height:13px;background:var(--acc);left:var(--rx,30%)}
.prompt{position:absolute;left:2px;top:716px;width:716px;min-height:126px;border-radius:16px;background:rgba(22,22,24,.84);padding:15px 22px 18px;opacity:0;transform:translateY(14px);transition:opacity .4s,transform .5s var(--ez)}
.prompt.show{opacity:1;transform:none}
.prompt .ph{display:flex;justify-content:space-between;align-items:center}
.prompt .ph b{display:flex;align-items:center;gap:8px;font:700 15px var(--f-cn);color:var(--acc)}
.prompt .ph b::before{content:"";width:4px;height:15px;border-radius:2px;background:var(--acc)}
.prompt .ph span{font:500 11.5px var(--f-mono);letter-spacing:.36em;color:#858587}
.prompt p{margin:12px 0 0;font:700 20.5px/34px var(--f-cn);color:#f4f4f2;min-height:34px}
.prompt em{font-style:normal;color:var(--acc)}
.caret{display:inline-block;width:2px;height:20px;background:var(--acc);vertical-align:-3px;margin-left:3px;animation:blink 1s steps(1) infinite}
.cap{position:absolute;left:50%;top:951px;transform:translate(-50%,-50%);font:700 37px/1.25 var(--f-cn);background:rgba(16,16,18,.8);padding:10px 24px 11px;border-radius:40px;white-space:nowrap;opacity:0;transition:opacity .2s;color:#fff}
.cap.show{opacity:1}
.cap.o{color:var(--acc)}
.cap em{font-style:normal;color:var(--acc)}
.geo{position:absolute;left:14px;right:14px;top:1022px;display:flex;justify-content:space-between;font:500 12px var(--f-mono);letter-spacing:.24em;color:rgba(205,205,205,.5);font-variant-numeric:tabular-nums}
.xh{position:absolute;width:11px;height:11px;pointer-events:none}
.xh::before,.xh::after{content:"";position:absolute;background:rgba(255,255,255,.26)}
.xh::before{left:5px;top:0;width:1px;height:11px}.xh::after{left:0;top:5px;width:11px;height:1px}
.odot{position:absolute;left:663px;top:1058px;width:5px;height:5px;border-radius:50%;background:var(--acc)}

.ctl{position:absolute;left:50%;bottom:calc(12px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:20;display:flex;align-items:center;gap:4px;background:rgba(18,18,20,.88);border:1px solid rgba(255,255,255,.08);border-radius:999px;padding:5px}
.ctl button{border:0;background:none;height:34px;min-width:34px;border-radius:999px;display:grid;place-items:center;cursor:pointer;color:#e8e8e6}
.ctl button:hover{background:rgba(255,255,255,.08)}
.ctl .pl{padding:0 14px;display:flex;gap:8px;align-items:center;white-space:nowrap;font:600 12px var(--f-cn);background:rgba(255,149,0,.14);color:var(--acc)}
.ctl .pl.off{background:rgba(255,255,255,.06);color:#e8e8e6}
.ctl .lb{font:500 10.5px var(--f-mono);letter-spacing:.14em;color:#8c8e91;padding:0 10px 0 6px;font-variant-numeric:tabular-nums;white-space:nowrap}

/* fake cursor + callouts (canvas px) */
.fcur{position:absolute;left:0;top:0;width:30px;height:30px;z-index:90;pointer-events:none;opacity:0;transition:opacity .25s;filter:drop-shadow(0 2px 3px rgba(0,0,0,.4))}
.fcur svg{transition:transform .12s}
.fcur.dn svg{transform:scale(.84)}
.co{position:absolute;inset:0;pointer-events:none;z-index:80}
.co svg{position:absolute;left:0;top:0;overflow:visible}
.co line{stroke:var(--acc);stroke-width:2.6;stroke-dasharray:900;stroke-dashoffset:900;transition:stroke-dashoffset .5s var(--ez)}
.co circle{fill:var(--acc);stroke:rgba(255,149,0,.35);stroke-width:9;transform-box:fill-box;transform-origin:center;transform:scale(0);transition:transform .35s var(--ez)}
.co .lbl{position:absolute;background:#121212;color:#fff;font:700 25px var(--f-cn);padding:9px 18px;border:2.6px solid var(--acc);border-radius:13px;white-space:nowrap;transform:translate(-50%,-50%) scale(.82);opacity:0;transition:opacity .3s .12s,transform .45s .12s cubic-bezier(.2,.9,.3,1.35)}
.co.show line{stroke-dashoffset:0}.co.show circle{transform:scale(1)}
.co.show .lbl{opacity:1;transform:translate(-50%,-50%) scale(1)}
@media (prefers-reduced-motion:reduce){.scene{transition:none}.sbg{animation:none}}
/* ================= D1 · Bento ================= */
.d1{width:1080px;height:700px;background:#121214;border-radius:30px;position:relative;color:#fff;overflow:hidden;border:1px solid rgba(255,255,255,.07);font-family:'Inter',sans-serif}
.d1-logo{position:absolute;left:20px;top:17px;width:40px;height:40px;border-radius:50%;background:#fff;color:#111;font:800 14px/40px Inter;text-align:center}
.d1-top{position:absolute;left:82px;right:18px;top:18px;height:38px;display:flex;align-items:center;gap:8px}
.d1 .crumb{font:500 14px Inter;color:#8e8e93}.d1 .crumb b{color:#fff;font-weight:600}
.d1 .cbtn{width:38px;height:38px;border-radius:50%;background:#fff;color:#111;display:grid;place-items:center}
.d1 .loc{height:38px;border-radius:999px;background:#fff;color:#111;font:600 12.5px Inter;padding:0 14px;display:flex;align-items:center;gap:6px}
.d1-side{position:absolute;left:18px;top:80px;bottom:18px;width:44px;display:flex;flex-direction:column;align-items:center;gap:12px;color:#8e8e93}
.d1-side span{width:42px;height:42px;border-radius:12px;display:grid;place-items:center}
.d1-side .on{background:#cde9f7;color:#1a1a1a}
.d1-side .plus{border-radius:50%;background:#fff;color:#111;width:36px;height:36px}
.d1-side .av{border-radius:50%;background:#f0a47a;color:#2a1a10;font:700 12px Inter;width:38px;height:38px}
.d1-grid{position:absolute;left:76px;top:72px;width:986px;height:610px}
.d1-grid.noanim .bc{transition:none}
.bc{position:absolute;border-radius:24px;padding:18px 20px;overflow:hidden;cursor:grab;user-select:none;-webkit-user-select:none;touch-action:none;transition:left .55s var(--ez),top .55s var(--ez),transform .25s,box-shadow .25s}
.bc.drag{transition:transform .2s,box-shadow .2s;z-index:20;transform:scale(1.03) rotate(-2.2deg);box-shadow:0 34px 70px rgba(0,0,0,.6);cursor:grabbing}
.d1 .ph{position:absolute;border:2px dashed rgba(255,255,255,.3);border-radius:24px;opacity:0;transition:left .4s var(--ez),top .4s var(--ez),width .4s var(--ez),height .4s var(--ez),opacity .25s}
.d1 .ph.show{opacity:1}
.d1 .row{display:flex;align-items:center;justify-content:space-between;gap:8px}
.d1 .dt{margin:0;font:400 25px/1 var(--f-disp);letter-spacing:.2px;white-space:nowrap}
.d1 .dt.sm{font-size:19px}.d1 .dt.md{font-size:21px;color:#14181b;line-height:1.02}.d1 .dt.big{font-size:29px;color:#1b1b1d}
.d1 .pill{font:600 11px Inter;padding:5px 10px;border-radius:999px;background:rgba(255,255,255,.24);display:inline-flex;gap:4px;align-items:center;white-space:nowrap}
.d1 .pill.dk{background:rgba(255,255,255,.3);color:#1b1b1d}
.d1 .pill.wt{background:#fff;color:#1b1b1d;margin-top:8px}
.d1 .arr{width:32px;height:32px;border-radius:50%;background:#fff;color:#111;display:grid;place-items:center;flex:none}
.d1 .arr.sm{width:28px;height:28px}
.venue{background:#7d7ff3}
.days{display:grid;grid-template-columns:repeat(7,1fr);margin-top:12px;text-align:center}
.days small{display:block;font:500 11px Inter;margin-bottom:6px}
.days b{display:inline-grid;place-items:center;width:44px;height:44px;border-radius:50%;background:#fff;color:#1b1b1f;font:700 13px Inter}
.days b.k{background:#141416;color:#fff}
.days b.h{background:repeating-linear-gradient(-45deg,rgba(255,255,255,.4) 0 2px,rgba(255,255,255,.12) 2px 6px);color:#fff}
.venue .area{position:absolute;left:16px;bottom:10px;height:44px;width:calc(100% - 32px)}
.staff,.aiops{background:#232325}
.sico{width:42px;height:42px;border-radius:12px;background:#f6cf5a;color:#1a1a1a;display:grid;place-items:center;flex:none}
.stx{flex:1;margin-left:14px;min-width:0}
.stx p{margin:6px 0 0;font:500 11.5px/1.6 Inter;color:#a1a1a6}
.cd{font:700 11px var(--f-mono);background:#f6cf5a;color:#1a1a1a;padding:1px 6px;border-radius:5px}
.loads{position:absolute;left:20px;right:20px;bottom:22px;display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.loads small{font:500 10.5px Inter;color:#8e8e93}
.loads i{display:block;height:7px;border-radius:9px;background:#3a3a3d;margin-top:8px;overflow:hidden}
.loads b{display:block;height:100%;border-radius:9px;transition:width 1s var(--ez)}
.thru{background:linear-gradient(160deg,#ff8461,#ff6e4d)}
.tico{width:42px;height:42px;border-radius:12px;background:#1b1b1d;color:#fff;display:grid;place-items:center}
.tbody{position:absolute;left:20px;right:16px;top:80px;bottom:16px;display:grid;grid-template-columns:minmax(0,1fr) 186px;gap:14px}
.tchart{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;position:relative}
.tb{position:relative;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;cursor:pointer}
.tb i{width:26px;border-radius:13px;background:repeating-linear-gradient(-45deg,rgba(255,255,255,.58) 0 2px,rgba(255,255,255,.26) 2px 6px);transition:background .25s}
.tb.on i{background:#dcf0e8}
.tb small{font:500 10px Inter;color:#3b1f17;margin-top:9px;padding:2px 7px;border-radius:9px;transition:.2s}
.tb.on small{background:#1b1b1d;color:#fff}
.tb .tip{position:absolute;font:700 11px var(--f-mono);background:#1b1b1d;color:#fff;padding:5px 9px;border-radius:8px;white-space:nowrap;opacity:0;transform:translateY(5px);transition:.25s}
.tb.on .tip{opacity:1;transform:none}
.tside{display:grid;grid-template-rows:1fr 1fr;gap:12px}
.tk{background:rgba(255,255,255,.2);border-radius:16px;padding:14px;display:flex;flex-direction:column;justify-content:space-between}
.tk small{font:700 10.5px Inter;letter-spacing:.04em;color:#3a1c12}
.d1 .chip{font:600 10px var(--f-mono);background:rgba(255,255,255,.42);padding:2px 7px;border-radius:9px;color:#3a1c12}
.tk b{font:700 27px Inter;color:#1b1b1d;letter-spacing:-.5px}
.tk em{font-style:normal;font-size:17px}
.msg{display:flex;gap:10px;margin-top:14px}
.aiav{width:28px;height:28px;border-radius:50%;background:#7d7ff3;font:700 10px/28px Inter;text-align:center;flex:none}
.msg p{margin:0;background:#2f2f32;border-radius:10px;padding:8px 12px;font:500 11.5px/1.55 Inter;color:#dcdce0;flex:1}
.chips{display:flex;gap:8px;margin-top:12px}
.chips span{font:600 11px Inter;padding:6px 12px;border-radius:999px;color:#1b1b1d}
.c1{background:#c4e6f7}.c2{background:#e8e8e8}
.ask{display:flex;align-items:center;gap:10px;margin-top:12px;background:#2c2c2f;border-radius:10px;padding:5px 8px}
.ask span{width:24px;height:24px;border-radius:50%;background:#ff6b4a;display:grid;place-items:center}

function initD1(cv){
  const root=$('.d1',cv),grid=$('.d1-grid',root),ph=$('.ph',grid),hud=cv._hud;
  const cards=$$('.bc',grid),by=id=>cards.find(c=>c.dataset.id===id);
  const INIT=cards.map(c=>c.dataset.id);let order=[...INIT];
  const C=4,G=12,CW=(986-G*3)/4,RH=(610-G*2)/3;
  const NM={venue:'VENUE',staff:'STAFF',thru:'THRU',ai:'AI OPS',points:'POINTS',timing:'TIMING'};
  function pack(ord){const occ=[],pos={};let rows=0;for(const id of ord){const c=by(id),w=+c.dataset.w,h=+c.dataset.h;let done=false;for(let r=0;r<8&&!done;r++)for(let col=0;col+w<=C&&!done;col++){let ok=true;for(let dr=0;dr<h&&ok;dr++)for(let dc=0;dc<w;dc++)if(occ[(r+dr)*C+col+dc]){ok=false;break}if(ok){for(let dr=0;dr<h;dr++)for(let dc=0;dc<w;dc++)occ[(r+dr)*C+col+dc]=1;pos[id]={r,c:col,w,h};rows=Math.max(rows,r+h);done=true}}}return{pos,rows}}

  let lay=pack(order).pos;const moving=new Map();let drag=null;
  function hudU(){const mv=[...moving.keys()].filter(c=>!drag||c!==drag.c).length;const on=!!(drag&&drag.on);hud.set('GRID','4 × 3');hud.set('DRAG',on?NM[drag.c.dataset.id]:'—');hud.set('REFLOW',`${5-Math.min(5,mv)} / 5`)}
  function apply(skip){for(const c of cards){const r=R(lay[c.dataset.id]);c.style.width=r.w+'px';c.style.height=r.h+'px';if(c===skip)continue;const ox=parseFloat(c.style.left),oy=parseFloat(c.style.top);if(ox!==r.x||oy!==r.y){c.style.left=r.x+'px';c.style.top=r.y+'px';if(!isNaN(ox)){clearTimeout(moving.get(c));moving.set(c,setTimeout(()=>{moving.delete(c);hudU()},560))}}}hudU()}
  function setPh(id){const r=R(lay[id]);Object.assign(ph.style,{left:r.x+'px',top:r.y+'px',width:r.w+'px',height:r.h+'px'})}
  grid.addEventListener('pointerdown',e=>{const c=e.target.closest('.bc');if(!c||(e.button||0)>0)return;const p=toD(cv,e);drag={c,sx:p.x,sy:p.y,ox:parseFloat(c.style.left),oy:parseFloat(c.style.top),on:false,last:null,cool:0};e.preventDefault()});
  window.addEventListener('pointermove',e=>{

    if(!drag.on){if(Math.hypot(dx,dy)<6)return;drag.on=true;drag.c.classList.add('drag');setPh(drag.c.dataset.id);ph.classList.add('show');hudU()}
    drag.c.style.left=drag.ox+dx+'px';drag.c.style.top=drag.oy+dy+'px';
    const gx=p.x-76,gy=p.y-72,id=drag.c.dataset.id,now=performance.now();if(now<drag.cool)return;
    let hit=null;for(const o of order){if(o===id)continue;const r=R(lay[o]),ix=r.w*.14,iy=r.h*.14;if(gx>r.x+ix&&gx<r.x+r.w-ix&&gy>r.y+iy&&gy<r.y+r.h-iy){hit=o;break}}
    if(!hit){drag.last=null;return}if(hit===drag.last)return;drag.last=hit;
    const a=order.indexOf(id),b=order.indexOf(hit),n=order.filter(o=>o!==id),bi=n.indexOf(hit);n.splice(a<b?bi+1:bi,0,id);
    const pk=pack(n);if(pk.rows>3)return;order=n;lay=pk.pos;apply(drag.c);setPh(id);drag.cool=now+280;
  });
  window.addEventListener('pointerup',()=>{if(!drag)return;const d=drag;drag=null;if(d.on){d.c.classList.remove('drag');ph.classList.remove('show');apply()}hudU()});
  apply();requestAnimationFrame(()=>requestAnimationFrame(()=>grid.classList.remove('noanim')));

/* ---------- helpers ---------- */
function makeHud(el,rows){
  el.innerHTML=rows.map(([k,v])=>`<span class="k">${k}</span><span class="v" data-v="${k}">${v}</span>`).join('');
  return {set(k,v){const kv=el.querySelector(`[data-v="${k}"]`);if(kv&&kv.textContent!==String(v))kv.textContent=v},hot(v){el.classList.toggle('hot',v)}};
}
const NOHUD={set(){},hot(){}};
const CURSOR='<svg width="30" height="30" viewBox="0 0 28 28"><path d="M4 2.5v20.2l5.3-5.1 3.6 8.3 3.4-1.5-3.6-8.1h7.4z" fill="#111" stroke="#fff" stroke-width="1.6" stroke-linejoin="round"/></svg>';
const ease=k=>k<.5?2*k*k:1-Math.pow(-2*k+2,2)/2;
function makeCursor(cv){
  const el=document.createElement('div');el.className='fcur';el.innerHTML=CURSOR;cv.appendChild(el);
  let x=0,y=0,down=false,raf=0;const put=()=>el.style.transform=`translate(${x-4}px,${y-2}px)`;
  function fire(type){const r=cv.getBoundingClientRect(),s=r.width/cv._W,cx=r.left+x*s,cy=r.top+y*s;let t=document.elementFromPoint(cx,cy);if(!t||!cv.contains(t)){if(type==='pointerdown'||type==='click')return;t=cv}
    const C=type==='click'?MouseEvent:PointerEvent;t.dispatchEvent(new C(type,{bubbles:true,cancelable:true,clientX:cx,clientY:cy,pointerId:7,pointerType:'mouse',isPrimary:true,button:0,buttons:down?1:0}))}
  return{show(px,py){x=px;y=py;put();el.style.opacity=1},hide(){el.style.opacity=0;cancelAnimationFrame(raf);if(down){down=false;el.classList.remove('dn');fire('pointerup')}},
    move(tx,ty,ms,tk){cancelAnimationFrame(raf);const x0=x,y0=y,t0=performance.now();const step=now=>{if(tk.dead)return;const k=Math.min(1,(now-t0)/ms),e=ease(k);x=x0+(tx-x0)*e;y=y0+(ty-y0)*e;put();fire('pointermove');if(k<1)raf=requestAnimationFrame(step)};raf=requestAnimationFrame(step)},
    down(){down=true;el.classList.add('dn');fire('pointerdown')},up(){down=false;el.classList.remove('dn');fire('pointerup')},click(){fire('click')}};
}
function makeCallout(cv,tg,lb,text){
  const w=document.createElement('div');w.className='co';
  w.innerHTML=`<svg width="${cv._W}" height="${cv._H}"><line x1="${tg.x}" y1="${tg.y}" x2="${lb.x}" y2="${lb.y}"/><circle cx="${tg.x}" cy="${tg.y}" r="7"/></svg><div class="lbl" style="left:${lb.x}px;top:${lb.y}px">${text}</div>`;
  cv.appendChild(w);requestAnimationFrame(()=>requestAnimationFrame(()=>w.classList.add('show')));return w;
}
function ptOf(cv,el,fx=.5,fy=.5){const r=el.getBoundingClientRect(),c=cv.getBoundingClientRect(),s=c.width/cv._W;return{x:(r.left+r.width*fx-c.left)/s,y:(r.top+r.height*fy-c.top)/s}}
const mark=s=>s.replace(/\[/g,'<em>').replace(/\]/g,'</em>');
function promptHTML(src,n){let out='',i=0,hl=false;for(const ch of src){if(ch==='['){hl=true;out+='<em>';continue}if(ch===']'){hl=false;out+='</em>';continue}if(n!=null&&i>=n)break;out+=ch;i++}if(hl)out+='</em>';return out}
const plen=src=>src.replace(/[\[\]]/g,'').length;

/* ---------- build stage ---------- */
const stage=$('#stage'),swrap=$('#swrap'),deckEl=$('#deck');
const S=SC.map((cfg,i)=>{
  const el=document.createElement('div');el.className='scene gone';
  const [segs,ci]=cfg.series||[6,i];
  el.innerHTML=`<div class="sbg" style="background-image:url(media/bg${cfg.bg}.jpg)"></div>
  <div class="prog">${Array.from({length:segs},(_,k)=>`<i class="${k<ci?'d':k===ci?'c':''}"></i>`).join('')}</div><i class="sbar"></i>
  <div class="hbadge">${cfg.n}</div><div class="htext"><h2>${cfg.t}</h2><small>${cfg.e}</small></div>${cfg.hud?'<div class="hud"></div>':''}
  <div class="dash"><div class="canvas">${cfg.html()}</div><i class="br tl"></i><i class="br tr"></i><i class="br bl"></i><i class="br bx"></i><div class="ruler"></div></div>
  <div class="prompt"><div class="ph"><b>AI描述词</b><span>PROMPT</span></div><p></p></div>
  <div class="cap"></div>
  <div class="geo"><span>N 46.24° · E 11.39°</span><span class="alt">ALT 2266 M</span></div>
  <i class="xh" style="left:49px;top:1069px"></i><i class="xh" style="left:355px;top:1113px"></i><i class="odot"></i>`;
  stage.appendChild(el);
  const cv=$('.canvas',el);cv._W=1080;cv._H=700;
  cv._hud=cfg.hud?makeHud($('.hud',el),cfg.hud):NOHUD;
  const api=cfg.init(cv);
  return{el,cfg,cv,api,hud:cv._hud,prompt:$('.prompt',el),pp:$('.prompt p',el),cap:$('.cap',el),cur:makeCursor(cv),cos:[]};
});

function fit(){const W=deckEl.clientWidth,H=deckEl.clientHeight-64;const k=Math.max(.2,Math.min(W/720,H/1280));swrap.style.width=720*k+'px';swrap.style.height=1280*k+'px';stage.style.transform=`scale(${k})`}
fit();addEventListener('resize',fit);

/* ---------- playback ---------- */
let cur=-1,auto=!matchMedia('(prefers-reduced-motion: reduce)').matches,tk=null,started=false,visible=false;
function setCap(s,text,o){const c=s.cap;c.classList.remove('show');clearTimeout(c._t);if(!text)return;c._t=setTimeout(()=>{c.innerHTML=mark(text);c.classList.toggle('o',!!o);c.classList.add('show')},text&&c.textContent?110:0)}
function stop(){if(!tk)return;tk.dead=true;tk.ids.forEach(clearTimeout);tk=null;S.forEach(s=>{s.cur.hide();s.cos.forEach(w=>{w.classList.remove('show');setTimeout(()=>w.remove(),400)});s.cos=[]})}
function settle(s){s.el.classList.remove('pre','t0');s.prompt.classList.add('show');s.pp.innerHTML=promptHTML(s.cfg.p);s.hud.hot(true);s.api.hot&&s.api.hot(true);setCap(s,'')}
function resetScene(s){s.api.reset();s.hud.hot(false);s.prompt.classList.remove('show');s.pp.innerHTML='';s.cap.classList.remove('show');s.cap.innerHTML='';
  s.el.classList.add('pre','t0');$('.ruler',s.el).style.setProperty('--rx',(8+Math.random()*80)+'%');$('.alt',s.el).textContent=`ALT ${2262+Math.floor(Math.random()*140)} M`;s.cfg.pre&&s.cfg.pre(s.api)}
function go(i,push=true){
  i=(i+S.length)%S.length;stop();const prev=cur;cur=i;const s=S[i];resetScene(s);
  S.forEach((o,j)=>{if(j!==i&&j!==prev)o.el.classList.add('gone')});
  s.el.classList.remove('gone');
  if(push&&prev>=0&&prev!==i){const dir=i>prev||(prev===S.length-1&&i===0)?1:-1;const o=S[prev].el;
    s.el.classList.add('notr');s.el.style.transform=`translateX(${dir*720}px)`;void s.el.offsetWidth;s.el.classList.remove('notr');
    requestAnimationFrame(()=>{s.el.style.transform='translateX(0)';o.style.transform=`translateX(${-dir*720}px)`});setTimeout(()=>{if(cur!==prev)o.classList.add('gone')},560)}
  else{s.el.classList.add('notr');s.el.style.transform='translateX(0)';void s.el.offsetWidth;s.el.classList.remove('notr')}
  updUI();run(s);
}
function run(s){
  const t={dead:false,ids:[]};tk=t;const off=.12;
  const at=(sec,fn)=>t.ids.push(setTimeout(()=>{if(!t.dead)try{fn()}catch(e){console.error(e)}},(sec+off)*1000));
  const mo=s.cfg.morph??.9;
  at(.15,()=>s.el.classList.remove('t0'));at(mo,()=>s.el.classList.remove('pre'));
  if(!auto){at(mo+.7,()=>settle(s));return}
  s.cfg.caps.forEach(([sec,text,o])=>at(sec,()=>setCap(s,text,o)));
  const [p0,p1]=s.cfg.pr,n=plen(s.cfg.p);
  at(p0,()=>{s.prompt.classList.add('show');s.pp.innerHTML='<span class="caret"></span>'});
  for(let k=1;k<=n;k++)at(p0+.35+(p1-p0-.35)*k/n,()=>{s.pp.innerHTML=promptHTML(s.cfg.p,k)+'<span class="caret"></span>'});
  at(p0+1.2,()=>{s.hud.hot(true);s.api.hot&&s.api.hot(true)});
  const res=v=>typeof v==='function'?v():v;
  const c={cv:s.cv,at,pt:(el,fx,fy)=>ptOf(s.cv,el,fx,fy),
    show:(sec,x,y)=>at(sec,()=>s.cur.show(x,y)),
    move:(sec,p,d)=>at(sec,()=>{const q=res(p);s.cur.move(q.x,q.y,d*1000,t)}),
    down:sec=>at(sec,()=>s.cur.down()),up:sec=>at(sec,()=>s.cur.up()),
    click:sec=>{at(sec,()=>s.cur.down());at(sec+.11,()=>{s.cur.up();s.cur.click()})},
    callout:(a,b,tg,lb,text)=>{let w;at(a,()=>{w=makeCallout(s.cv,res(tg),lb,text);s.cos.push(w)});at(b,()=>{if(!w)return;w.classList.remove('show');s.cos=s.cos.filter(x=>x!==w);setTimeout(()=>w.remove(),400)})},
    tween:(d,f)=>{const t0=performance.now();const st=now=>{if(t.dead)return;const k=Math.min(1,(now-t0)/(d*1000));f(ease(k));if(k<1)requestAnimationFrame(st)};requestAnimationFrame(st)},
    scroll:(el,to,d)=>{const from=el.scrollTop;c.tween(d,k=>{el.scrollTop=from+(to-from)*k})}};
  s.cfg.script(c,s.api);
  at(s.cfg.pr[1]+1.0,()=>s.cur.hide());
  at(s.cfg.dur,()=>{if(auto&&visible)go(cur+1)});
}
function updUI(){$('#bPlay').innerHTML=(auto?ic('pause',14):ic('play',14))+`<span>${auto?'自动演示中':'自动演示'}</span>`;$('#bPlay').classList.toggle('off',!auto);
  $('#bLbl').textContent=cur<6?`${SC[cur].n} / 06`:'GLOW · 06 / 08'}
function userTook(){const s=S[cur];if(!s||!auto)return;auto=false;stop();settle(s);updUI()}
stage.addEventListener('pointerdown',e=>{if(e.isTrusted&&e.target.closest('.dash'))userTook()},true);
stage.addEventListener('wheel',e=>{if(e.target.closest('.dash'))userTook()},{capture:true,passive:true});
$('#bPrev').innerHTML=ic('chevl',16);$('#bNext').innerHTML=ic('chevr',16);
$('#bPrev').addEventListener('click',()=>go(cur-1));$('#bNext').addEventListener('click',()=>go(cur+1));
$('#bPlay').addEventListener('click',()=>{auto=!auto;updUI();if(auto)go(cur,false);else{stop();settle(S[cur])}});
document.addEventListener('keydown',e=>{if(!visible)return;const s=S[cur];
  if(s.cfg.init===initD6&&(e.key==='ArrowDown'||e.key==='ArrowUp')){e.preventDefault();userTook();s.api.key(e.key==='ArrowDown'?1:-1);return}
  if(s.cfg.init===initD6&&e.key==='Escape'){s.api.close();return}
  if(e.key==='ArrowRight')go(cur+1);else if(e.key==='ArrowLeft')go(cur-1)});
new IntersectionObserver(es=>{for(const en of es){visible=en.isIntersecting&&en.intersectionRatio>=.5;
  if(visible){if(!started){started=true;go(0,false)}else if(auto&&!tk)go(cur,false)}
  else if(tk&&auto){stop()}}},{threshold:[0,.5,1]}).observe(deckEl);
cur=0;resetScene(S[0]);S[0].el.classList.remove('gone','t0');
updUI();
(document.fonts?document.fonts.ready:Promise.resolve()).then(fit);
