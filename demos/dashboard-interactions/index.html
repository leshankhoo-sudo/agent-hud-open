<title>Dashboard Interaction</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;700&family=Noto+Sans+SC:wght@400;500;700;900&display=swap">
<style>
/* Layout: one phone-first column — progress, chapter header + HUD, scaled dashboard frame, AI prompt, caption.
   Single deliberate dark look (replica of the reference video), so no light variant. */
:root{
  --bg:#232426; --ink:#f3f3f1; --mute:#8c8e91; --dim:#5d5f63; --acc:#ff9500; --panel:rgba(17,18,20,.74);
  --ez:cubic-bezier(.2,.8,.2,1);
  --f-ui:'Inter','Noto Sans SC','PingFang SC','Microsoft YaHei',system-ui,sans-serif;
  --f-cn:'Noto Sans SC','PingFang SC','Microsoft YaHei','Inter',sans-serif;
  --f-mono:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
  --f-disp:'Archivo Black','Inter','Noto Sans SC',sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{min-height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-ui);overflow-x:hidden;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}
button:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.sp{flex:1}
.ic{flex:none;display:block}
#bgc{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
#app{position:relative;z-index:1;max-width:1120px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px 96px}

/* progress */
.prog{display:flex;gap:6px;margin-bottom:16px}
.prog button{flex:1;padding:6px 0;background:none;border:0;cursor:pointer}
.prog i{display:block;height:3px;border-radius:2px;background:rgba(255,255,255,.16);transition:background .4s}
.prog .done i{background:rgba(255,255,255,.52)}
.prog .on i{background:var(--acc)}

/* deck */
.deck{display:grid;overflow:hidden;overflow:clip}
.slide{grid-area:1/1;min-width:0;position:relative;transition:transform .75s cubic-bezier(.7,0,.2,1)}
.slide.next{transform:translateX(108%)}
.slide.prev{transform:translateX(-108%)}
.slide:not(.cur){pointer-events:none}

.hd{display:flex;align-items:flex-start;gap:12px;min-height:66px}
.badge{flex:none;width:40px;height:40px;border-radius:10px;background:var(--acc);color:#111;font:800 19px/40px var(--f-ui);text-align:center;letter-spacing:-.5px}
.ttl{flex:1;min-width:0;padding-top:1px}
.ttl h2{margin:0;font:700 clamp(18px,3.4vw,26px)/1.15 var(--f-cn);letter-spacing:.5px;text-wrap:balance}
.ttl small{display:block;margin-top:5px;font:500 11px var(--f-mono);letter-spacing:.32em;color:var(--mute)}
.hud{flex:none;background:rgba(14,14,16,.84);border:1px solid rgba(255,255,255,.06);border-radius:10px;padding:7px 10px;font:500 10.5px/1.6 var(--f-mono);letter-spacing:.12em;display:grid;grid-template-columns:auto auto;column-gap:16px;min-width:146px;font-variant-numeric:tabular-nums}
.hud .k{color:#6f7175;transition:color .3s}
.hud .v{color:#e9e9e7;text-align:right;letter-spacing:.04em;transition:color .3s;white-space:nowrap}
.hud .on{color:var(--acc)}

.frame{position:relative;margin-top:16px;border-radius:16px;background:var(--panel);padding:24px 0 30px;box-shadow:0 30px 80px rgba(0,0,0,.35)}
.br{position:absolute;width:14px;height:14px;border:0 solid rgba(255,255,255,.38);z-index:8;pointer-events:none}
.br.tl{left:9px;top:9px;border-left-width:1.5px;border-top-width:1.5px}
.br.tr{right:9px;top:9px;border-right-width:1.5px;border-top-width:1.5px}
.br.bl{left:9px;bottom:9px;border-left-width:1.5px;border-bottom-width:1.5px}
.br.brr{right:9px;bottom:9px;border-right-width:1.5px;border-bottom-width:1.5px}
.ruler{position:absolute;left:30px;right:30px;bottom:11px;height:9px;z-index:8;pointer-events:none;
  background:repeating-linear-gradient(90deg,rgba(255,255,255,.3) 0 1px,transparent 1px 50px) bottom/100% 9px no-repeat,repeating-linear-gradient(90deg,rgba(255,255,255,.14) 0 1px,transparent 1px 10px) bottom/100% 5px no-repeat}
.ruler::after{content:"";position:absolute;bottom:0;width:2px;height:13px;background:var(--acc);left:var(--rx,30%);transition:left 1.4s var(--ez)}
.fit{position:relative;width:100%;margin:0 auto}
.canvas{position:absolute;left:0;top:0;transform-origin:0 0;transform:scale(var(--s,1))}

/* title card */
.tcard{position:absolute;left:0;right:0;top:120px;display:flex;align-items:center;gap:clamp(12px,3vw,22px);opacity:0;transform:translateX(50px);transition:opacity .55s,transform .7s var(--ez);pointer-events:none;z-index:9}
.slide.intro .tcard{opacity:1;transform:none}
.tcard .big{flex:none;width:clamp(72px,14vw,104px);aspect-ratio:1;max-width:100%;border-radius:22%;background:var(--acc);color:#111;font:800 clamp(38px,7.6vw,58px)/1 var(--f-ui);display:grid;place-items:center;letter-spacing:-1.5px}
.tcard h1{margin:0;font:700 clamp(24px,5.2vw,42px)/1.15 var(--f-cn);letter-spacing:1px;text-wrap:balance}
.tcard small{display:block;margin-top:10px;font:500 clamp(10px,1.6vw,14px) var(--f-mono);letter-spacing:.38em;color:#8b8d90}
.slide .hd,.slide .frame{transition:opacity .6s .05s,transform .8s .05s var(--ez)}
.slide.intro .hd{opacity:0;transform:translateY(-10px)}
.slide.intro .frame{opacity:0;transform:translateY(34px) scale(.985)}

/* prompt */
.prompt{margin-top:14px;background:rgba(20,20,22,.88);border:1px solid rgba(255,255,255,.06);border-radius:12px;padding:12px 16px 14px;opacity:0;transform:translateY(10px);transition:opacity .45s,transform .5s var(--ez)}
.prompt.show{opacity:1;transform:none}
.prompt .ph{display:flex;justify-content:space-between;align-items:center;font:700 12px var(--f-cn);color:var(--acc)}
.prompt .ph b{display:flex;align-items:center;gap:7px;font-weight:700}
.prompt .ph b::before{content:"";width:3px;height:12px;border-radius:2px;background:var(--acc)}
.prompt .ph span{font:500 10px var(--f-mono);letter-spacing:.3em;color:#6d6f73}
.prompt p{margin:8px 0 0;font:600 clamp(14px,2.3vw,17px)/1.7 var(--f-cn);color:#f1f1ef;min-height:3.4em}
.prompt em{font-style:normal;color:var(--acc)}
.caret{display:inline-block;width:2px;height:1em;background:var(--acc);vertical-align:-.15em;margin-left:2px;animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}

.capw{height:64px;display:grid;place-items:center;margin-top:10px}
.cap{font:700 clamp(17px,3vw,24px)/1.2 var(--f-cn);background:rgba(18,18,20,.74);padding:9px 20px;border-radius:999px;opacity:0;transform:translateY(6px) scale(.98);transition:opacity .3s,transform .35s var(--ez);text-align:center;max-width:100%}
.cap.show{opacity:1;transform:none}
.cap.hl{color:var(--acc)}
.geo{display:flex;justify-content:space-between;gap:12px;font:500 10px var(--f-mono);letter-spacing:.2em;color:#5f6165;margin-top:4px;font-variant-numeric:tabular-nums}

.ctl{position:fixed;left:50%;bottom:calc(14px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:20;display:flex;align-items:center;gap:4px;background:rgba(14,14,16,.86);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,.08);border-radius:999px;padding:5px}
.ctl button{border:0;background:none;height:36px;min-width:36px;border-radius:999px;display:grid;place-items:center;cursor:pointer;color:#e8e8e6}
.ctl button:hover{background:rgba(255,255,255,.08)}
.ctl .pl{padding:0 14px;display:flex;gap:8px;align-items:center;font:600 12px var(--f-cn);background:rgba(255,149,0,.14);color:var(--acc)}
.ctl .pl.off{background:rgba(255,255,255,.06);color:#e8e8e6}
.ctl .lb{font:500 10.5px var(--f-mono);letter-spacing:.14em;color:#8c8e91;padding:0 10px 0 6px;font-variant-numeric:tabular-nums}

/* cover */
.cover{padding-top:6px}
.cvt{display:flex;justify-content:space-between;align-items:center}
.eyes{display:flex;gap:8px}.eyes i{width:clamp(24px,4.4vw,34px);aspect-ratio:1;border-radius:50%;background:#fff;position:relative}
.eyes i::after{content:"";position:absolute;left:22%;top:30%;width:34%;aspect-ratio:1;border-radius:50%;background:#111;animation:look 6s ease-in-out infinite}
@keyframes look{0%,40%{transform:none}50%,90%{transform:translateX(70%)}}
.cvr{display:flex;align-items:center;gap:10px}
.six{width:clamp(30px,5vw,40px);aspect-ratio:1;border-radius:50%;background:#fff;color:#111;font:800 clamp(16px,2.6vw,20px)/1 var(--f-ui);display:grid;place-items:center}
.cvh{margin:clamp(14px,3vw,26px) 0 0;font:800 clamp(44px,10.5vw,104px)/.98 var(--f-ui);letter-spacing:-.035em}
.cvh span{display:block}.cvh .g{color:#a5a7aa}
.cvrow{display:flex;justify-content:space-between;align-items:flex-end;gap:12px}
.cvm{font:500 clamp(9px,1.5vw,12px)/1.7 var(--f-mono);letter-spacing:.3em;color:#86888b;text-align:right;padding-bottom:6px}
.cvl{display:flex;align-items:center;gap:10px;margin-top:22px}
.cvl .badge{width:28px;height:28px;font-size:13px;line-height:28px;border-radius:7px}
.cvl b{font:700 clamp(15px,2.6vw,20px) var(--f-cn)}
.cvl small{font:500 10px var(--f-mono);letter-spacing:.24em;color:#6b6d70}
.cvp{position:relative;margin-top:12px;border-radius:16px;overflow:hidden}
.cvp .fit{transition:opacity .45s}
.cvp .fit.fade{opacity:0}
.cvlist{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;margin-top:16px}
.cvlist button{display:flex;align-items:center;gap:8px;text-align:left;background:rgba(18,18,20,.7);border:1px solid rgba(255,255,255,.06);border-radius:10px;padding:8px 10px;cursor:pointer;font:600 12px var(--f-cn);color:#e6e6e4;min-width:0}
.cvlist button span{flex:none;width:22px;height:22px;border-radius:6px;background:var(--acc);color:#111;font:800 11px/22px var(--f-ui);text-align:center}
.cvlist button:hover{border-color:rgba(255,149,0,.5)}

/* fake cursor + callouts (design px, inside canvas) */
.fcur{position:absolute;left:0;top:0;width:30px;height:30px;z-index:90;pointer-events:none;opacity:0;transition:opacity .3s;filter:drop-shadow(0 2px 3px rgba(0,0,0,.45))}
.fcur svg{transition:transform .12s}
.fcur.dn svg{transform:scale(.84)}
.co{position:absolute;inset:0;pointer-events:none;z-index:80}
.co svg{position:absolute;left:0;top:0;overflow:visible}
.co line{stroke:var(--acc);stroke-width:2.5;stroke-dasharray:600;stroke-dashoffset:600;transition:stroke-dashoffset .55s var(--ez)}
.co circle{fill:var(--acc);stroke:rgba(255,149,0,.35);stroke-width:8;transform-box:fill-box;transform-origin:center;transform:scale(0);transition:transform .35s var(--ez)}
.co .lbl{position:absolute;background:#121212;color:#fff;font:700 24px var(--f-cn);padding:9px 18px;border:2.5px solid var(--acc);border-radius:13px;white-space:nowrap;transform:translate(-50%,-50%) scale(.82);opacity:0;transition:opacity .3s .15s,transform .45s .15s cubic-bezier(.2,.9,.3,1.35)}
.co.show line{stroke-dashoffset:0}.co.show circle{transform:scale(1)}
.co.show .lbl{opacity:1;transform:translate(-50%,-50%) scale(1)}

/* ================= D1 · Bento ================= */
.d1{width:1080px;height:700px;background:#121214;border-radius:30px;position:relative;color:#fff;overflow:hidden;border:1px solid rgba(255,255,255,.07);font-family:'Inter',sans-serif}
.d1-logo{position:absolute;left:20px;top:17px;width:40px;height:40px;border-radius:50%;background:#fff;color:#111;font:800 14px/40px Inter;text-align:center}
.d1-top{position:absolute;left:82px;right:18px;top:18px;height:38px;display:flex;align-items:center;gap:8px}
.d1 .crumb{font:500 14px Inter;color:#8e8e93}.d1 .crumb b{color:#fff;font-weight:600}
.d1 .cbtn{width:38px;height:38px;border-radius:50%;background:#fff;color:#111;display:grid;place-items:center}
.d1 .loc{height:38px;border-radius:999px;background:#fff;color:#111;font:600 12.5px Inter;padding:0 14px;display:flex;align-items:center;gap:6px}
.d1-side{position:absolute;left:18px;top:80px;bottom:18px;width:44px;display:flex;flex-direction:column;align-items:center;gap:12px;color:#8e8e93}
.d1-side span{width:42px;height:42px;border-radius:12px;display:grid;place-items:center}
.d1-side .on{background:#cde9f7;color:#1a1a1a}
.d1-side .plus{border-radius:50%;background:#fff;color:#111;width:36px;height:36px}
.d1-side .av{border-radius:50%;background:#f0a47a;color:#2a1a10;font:700 12px Inter;width:38px;height:38px}
.d1-grid{position:absolute;left:76px;top:72px;width:986px;height:610px}
.d1-grid.noanim .bc{transition:none}
.bc{position:absolute;border-radius:24px;padding:18px 20px;overflow:hidden;cursor:grab;user-select:none;-webkit-user-select:none;touch-action:none;transition:left .55s var(--ez),top .55s var(--ez),transform .25s,box-shadow .25s}
.bc.drag{transition:transform .2s,box-shadow .2s;z-index:20;transform:scale(1.03) rotate(-2.2deg);box-shadow:0 34px 70px rgba(0,0,0,.6);cursor:grabbing}
.d1 .ph{position:absolute;border:2px dashed rgba(255,255,255,.3);border-radius:24px;opacity:0;transition:left .4s var(--ez),top .4s var(--ez),width .4s var(--ez),height .4s var(--ez),opacity .25s}
.d1 .ph.show{opacity:1}
.d1 .row{display:flex;align-items:center;justify-content:space-between;gap:8px}
.d1 .dt{margin:0;font:400 27px/1 var(--f-disp);letter-spacing:.2px;white-space:nowrap}
.d1 .dt.sm{font-size:19px}.d1 .dt.md{font-size:21px;color:#14181b;line-height:1.02}.d1 .dt.big{font-size:29px;color:#1b1b1d}
.d1 .pill{font:600 11px Inter;padding:5px 10px;border-radius:999px;background:rgba(255,255,255,.24);display:inline-flex;gap:4px;align-items:center;white-space:nowrap}
.d1 .pill.dk{background:rgba(255,255,255,.3);color:#1b1b1d}
.d1 .pill.wt{background:#fff;color:#1b1b1d;margin-top:8px}
.d1 .arr{width:32px;height:32px;border-radius:50%;background:#fff;color:#111;display:grid;place-items:center;flex:none}
.d1 .arr.sm{width:28px;height:28px}
.venue{background:#7d7ff3}
.days{display:grid;grid-template-columns:repeat(7,1fr);margin-top:12px;text-align:center}
.days small{display:block;font:500 11px Inter;margin-bottom:6px}
.days b{display:inline-grid;place-items:center;width:44px;height:44px;border-radius:50%;background:#fff;color:#1b1b1f;font:700 13px Inter}
.days b.k{background:#141416;color:#fff}
.days b.h{background:repeating-linear-gradient(-45deg,rgba(255,255,255,.4) 0 2px,rgba(255,255,255,.12) 2px 6px);color:#fff}
.venue .area{position:absolute;left:16px;bottom:10px;height:44px;width:calc(100% - 32px)}
.staff,.aiops{background:#232325}
.sico{width:42px;height:42px;border-radius:12px;background:#f6cf5a;color:#1a1a1a;display:grid;place-items:center;flex:none}
.stx{flex:1;margin-left:14px;min-width:0}
.stx p{margin:6px 0 0;font:500 11.5px/1.6 Inter;color:#a1a1a6}
.cd{font:700 11px var(--f-mono);background:#f6cf5a;color:#1a1a1a;padding:1px 6px;border-radius:5px}
.loads{position:absolute;left:20px;right:20px;bottom:22px;display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.loads small{font:500 10.5px Inter;color:#8e8e93}
.loads i{display:block;height:7px;border-radius:9px;background:#3a3a3d;margin-top:8px;overflow:hidden}
.loads b{display:block;height:100%;border-radius:9px;transition:width 1s var(--ez)}
.thru{background:linear-gradient(160deg,#ff8461,#ff6e4d)}
.tico{width:42px;height:42px;border-radius:12px;background:#1b1b1d;color:#fff;display:grid;place-items:center}
.tbody{position:absolute;left:20px;right:16px;top:80px;bottom:16px;display:grid;grid-template-columns:minmax(0,1fr) 186px;gap:14px}
.tchart{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;position:relative}
.tb{position:relative;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;cursor:pointer}
.tb i{width:26px;border-radius:13px;background:repeating-linear-gradient(-45deg,rgba(255,255,255,.58) 0 2px,rgba(255,255,255,.26) 2px 6px);transition:background .25s}
.tb.on i{background:#dcf0e8}
.tb small{font:500 10px Inter;color:#3b1f17;margin-top:9px;padding:2px 7px;border-radius:9px;transition:.2s}
.tb.on small{background:#1b1b1d;color:#fff}
.tb .tip{position:absolute;font:700 11px var(--f-mono);background:#1b1b1d;color:#fff;padding:5px 9px;border-radius:8px;white-space:nowrap;opacity:0;transform:translateY(5px);transition:.25s}
.tb.on .tip{opacity:1;transform:none}
.tside{display:grid;grid-template-rows:1fr 1fr;gap:12px}
.tk{background:rgba(255,255,255,.2);border-radius:16px;padding:14px;display:flex;flex-direction:column;justify-content:space-between}
.tk small{font:700 10.5px Inter;letter-spacing:.04em;color:#3a1c12}
.d1 .chip{font:600 10px var(--f-mono);background:rgba(255,255,255,.42);padding:2px 7px;border-radius:9px;color:#3a1c12}
.tk b{font:700 27px Inter;color:#1b1b1d;letter-spacing:-.5px}
.tk em{font-style:normal;font-size:17px}
.msg{display:flex;gap:10px;margin-top:14px}
.aiav{width:28px;height:28px;border-radius:50%;background:#7d7ff3;font:700 10px/28px Inter;text-align:center;flex:none}
.msg p{margin:0;background:#2f2f32;border-radius:10px;padding:8px 12px;font:500 11.5px/1.55 Inter;color:#dcdce0;flex:1}
.chips{display:flex;gap:8px;margin-top:12px}
.chips span{font:600 11px Inter;padding:6px 12px;border-radius:999px;color:#1b1b1d}
.c1{background:#c4e6f7}.c2{background:#e8e8e8}
.ask{display:flex;align-items:center;gap:10px;margin-top:12px;background:#2c2c2f;border-radius:10px;padding:5px 8px}
.ask span{width:24px;height:24px;border-radius:50%;background:#ff6b4a;display:grid;place-items:center}
.ask em{font:500 11px Inter;font-style:normal;color:#6e6e73}
.points{background:#bfe5f6;color:#14181b}
.map{position:absolute;left:14px;right:14px;bottom:14px;height:88px;border-radius:14px;background:#8fd0ea;overflow:hidden}
.map svg{width:100%;height:100%;display:block}
.map .pin{position:absolute;left:22%;top:44%;width:13px;height:13px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);background:#ff5a3c}
.mlab{position:absolute;left:42%;top:30%;background:#fff;font:600 10.5px Inter;padding:4px 10px;border-radius:999px;color:#1b1b1d;box-shadow:0 2px 6px rgba(0,0,0,.15)}
.timing{background:#c9d0c9}
.clock{position:absolute;left:50%;bottom:12px;width:106px;height:106px;transform:translateX(-50%)}

/* ================= D2 · Expand ================= */
.d2{width:1080px;height:700px;background:#eef2f6;border-radius:30px;position:relative;overflow:hidden;font-family:Inter,sans-serif;color:#0f1726}
.d2-hd{position:absolute;left:18px;right:18px;top:16px;height:54px;display:flex;align-items:center;gap:14px}
.d2 .back{width:36px;height:36px;border-radius:50%;background:#fff;display:grid;place-items:center;color:#334}
.d2 .playb{width:48px;height:48px;border-radius:14px;background:linear-gradient(160deg,#3d8ff7,#1d6be0);color:#fff;display:grid;place-items:center;box-shadow:0 6px 14px rgba(29,107,224,.3)}
.d2-hd h3{margin:0;font:700 21px Inter;letter-spacing:-.3px}
.d2-hd .sub{display:flex;align-items:center;gap:8px;font:500 12px Inter;color:#5b6575;margin-top:4px}
.odot{width:11px;height:11px;border-radius:50%;background:#ff9500}
.bchip{font:600 10.5px Inter;color:#2f7cf6;background:#dbe8fd;padding:2px 7px;border-radius:7px}
.invite{font:600 12.5px Inter;color:#1f2937;display:flex;gap:8px;align-items:center}
.avs{display:flex;padding-left:9px}.avs i{width:34px;height:34px;border-radius:50%;border:2px solid #eef2f6;margin-left:-9px}
.avs b{width:34px;height:34px;border-radius:50%;margin-left:-9px;background:#2f7cf6;color:#fff;font:700 11px/30px Inter;text-align:center;border:2px solid #eef2f6}
.d2-body{position:absolute;left:18px;top:84px;width:1044px;height:600px}

function initD1(cv){

  const cards=$$('.bc',grid),by=id=>cards.find(c=>c.dataset.id===id);

  function pack(ord){const occ=[],pos={};let rows=0;for(const id of ord){const c=by(id),w=+c.dataset.w,h=+c.dataset.h;let done=false;for(let r=0;r<8&&!done;r++)for(let col=0;col+w<=C&&!done;col++){let ok=true;for(let dr=0;dr<h&&ok;dr++)for(let dc=0;dc<w;dc++)if(occ[(r+dr)*C+col+dc]){ok=false;break}if(ok){for(let dr=0;dr<h;dr++)for(let dc=0;dc<w;dc++)occ[(r+dr)*C+col+dc]=1;pos[id]={r,c:col,w,h};rows=Math.max(rows,r+h);done=true}}}return{pos,rows}}

    drag.c.style.left=drag.ox+dx+'px';drag.c.style.top=drag.oy+dy+'px';
    const gx=p.x-76,gy=p.y-72,id=drag.c.dataset.id,now=performance.now();if(now<drag.cool)return;

    const a=order.indexOf(id),b=order.indexOf(hit),n=order.filter(o=>o!==id),bi=n.indexOf(hit);n.splice(a<b?bi+1:bi,0,id);

  });
  window.addEventListener('pointerup',()=>{if(!drag)return;const d=drag;drag=null;if(d.on){d.c.classList.remove('drag');ph.classList.remove('show');apply()}hudU()});

  tick();setInterval(tick,1000);

async function demo7(c){const g=c.api;c.cur.show();
  c.cap('加一圈缓慢旋转的');await c.wait(1500);c.cap('渐变流光微边框');let p={x:560,y:162};await c.move(p.x,p.y,1100);
  const k=c.callout({x:586,y:156},{x:770,y:40},'只有2px那么细');await c.wait(2400);c.uncallout(k);
  await c.move(860,500,900);c.cap('并在模块背后映射出');await c.wait(1600);c.cap('柔和的毛玻璃弥散光晕');await c.wait(1900);
  c.cap('整个模块的层次一下就出来了');g.setSplit(0);g.setCmp(true);const t0=performance.now();
  await new Promise((res,rej)=>{const f=now=>{if(c.tok.dead)return rej(STOP);const k=Math.min(1,(now-t0)/3200);const e=t=>t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2;g.setSplit(k<.6?600*e(k/.6):lerp(600,320,e((k-.6)/.4)));k<1?requestAnimationFrame(f):res()};requestAnimationFrame(f)});
  await c.wait(600);g.setCmp(false);await c.wait(800)}

/* =========================================================
   build page
   ========================================================= */
const deck=$('#deck'),prog=$('#prog'),capEl=$('#cap');
const slides=[];
function promptHTML(src,n){let out='',i=0,hl=false;for(const ch of src){if(ch==='['){hl=true;out+='<em>';continue}if(ch===']'){hl=false;out+='</em>';continue}if(n!=null&&i>=n)break;out+=ch;i++}if(hl)out+='</em>';return out}
const plen=src=>src.replace(/[\[\]]/g,'').length;

// cover
const cov=document.createElement('section');cov.className='slide cover cur';
cov.innerHTML=`<div class="cvt"><div class="eyes"><i></i><i></i></div><div class="cvr">${ic('ur',34)}<span class="six">7</span></div></div>
<div class="cvrow"><h1 class="cvh"><span>Dashboard</span><span class="g">Interaction</span></h1><div class="cvm">07 WAYS<br>LAYOUT + INTERACTION</div></div>
<div class="cvl"><span class="badge">01</span><b>可以拖动的模块网格</b><small>BENTO DRAG</small></div>
<div class="cvp"><div class="fit"></div></div>
<div class="cvlist">${CH.map((c,i)=>`<button data-go="${i+1}"><span>${c.n}</span>${c.t}</button>`).join('')}</div>`;
deck.appendChild(cov);slides.push({el:cov});
$$('[data-go]',cov).forEach(b=>b.addEventListener('click',()=>{go(+b.dataset.go)}));

CH.forEach((ch,i)=>{
  const s=document.createElement('section');s.className='slide next';
  s.innerHTML=`<div class="tcard"><div class="big">${ch.n}</div><div><h1>${ch.t}</h1><small>${ch.e}</small></div></div>
  <div class="hd"><span class="badge">${ch.n}</span><div class="ttl"><h2>${ch.t}</h2><small>${ch.e}</small></div><div class="hud"></div></div>
  <div class="frame"><i class="br tl"></i><i class="br tr"></i><i class="br bl"></i><i class="br brr"></i><div class="fit"><div class="canvas">${ch.html()}</div></div><div class="ruler"></div></div>
  <div class="prompt"><div class="ph"><b>AI描述词</b><span>PROMPT</span></div><p></p></div>`;
  deck.appendChild(s);
  const cv=$('.canvas',s);cv._W=ch.W;cv._H=ch.H;cv.style.width=ch.W+'px';cv.style.height=ch.H+'px';
  cv._hud=makeHud($('.hud',s),ch.hud);
  const api=ch.init(cv);
  slides.push({el:s,ch,cv,api,cur:null,prompt:$('.prompt',s),pp:$('.prompt p',s)});
});
CH.forEach((c,i)=>{const b=document.createElement('button');b.setAttribute('aria-label',`${c.n} ${c.t}`);b.innerHTML='<i></i>';b.addEventListener('click',()=>go(i+1));prog.appendChild(b)});

function fitAll(){$$('.fit',deck).forEach(f=>{const cv=f.firstElementChild;if(!cv||!cv._W)return;const s=f.clientWidth/cv._W;cv.style.setProperty('--s',s);f.style.height=cv._H*s+'px'})}
new ResizeObserver(fitAll).observe(deck);addEventListener('resize',fitAll);

/* ---------- cover preview ---------- */
let covK=0,covT=null;
function coverShow(){const f=$('.cvp .fit',cov);const s=slides[covK+1];f.classList.add('fade');setTimeout(()=>{const cl=s.cv.cloneNode(true);$$('.fcur,.co',cl).forEach(x=>x.remove());cl._W=s.cv._W;cl._H=s.cv._H;f.innerHTML='';f.appendChild(cl);fitAll();const l=$('.cvl',cov);l.innerHTML=`<span class="badge">${s.ch.n}</span><b>${s.ch.t}</b><small>${s.ch.e}</small>`;f.classList.remove('fade')},300);covK=(covK+1)%CH.length}
function coverStart(){clearInterval(covT);coverShow();covT=setInterval(coverShow,2300)}

/* ---------- playback ---------- */
let curI=0,auto=!matchMedia('(prefers-reduced-motion: reduce)').matches,tok=null,live=[];
function cap(t,hl){capEl.classList.remove('show');if(!t)return;setTimeout(()=>{capEl.textContent=t;capEl.classList.toggle('hl',!!hl);capEl.classList.add('show')},120)}
function showPrompt(s,full){s.prompt.classList.add('show');if(full)s.pp.innerHTML=promptHTML(s.ch.p)}
async function typePrompt(s,tk){s.prompt.classList.add('show');const n=plen(s.ch.p);for(let i=0;i<=n;i++){s.pp.innerHTML=promptHTML(s.ch.p,i)+'<span class="caret"></span>';await sleep(i%7===0?70:42,tk)}}
function stop(){if(tok)tok.dead=true;tok=null;cap('');live.forEach(uncallout);live=[];slides.forEach(s=>{if(s.cur){if(s.cur.isDown())s.cur.up();s.cur.hide()}})}
function updUI(){$$('button',prog).forEach((b,j)=>{b.classList.toggle('on',j+1===curI);b.classList.toggle('done',j+1<curI)});
  $('#bPlay').innerHTML=(auto?ic('pause',14):ic('play',14))+`<span>${auto?'自动演示中':'自动演示'}</span>`;$('#bPlay').classList.toggle('off',!auto);
  $('#bLbl').textContent=curI?`${CH[curI-1].n} / 07`:'COVER'}
function go(i){
  i=(i+slides.length)%slides.length;stop();const prevI=curI;curI=i;
  slides.forEach((s,j)=>{s.el.classList.toggle('cur',j===i);s.el.classList.toggle('prev',j<i);s.el.classList.toggle('next',j>i);if(j!==i)s.el.classList.remove('intro')});
  updUI();clearInterval(covT);
  const s=slides[i],tk=tok={dead:false};
  if(!s.ch){coverStart();if(auto)sleep(5600,tk).then(()=>go(1)).catch(()=>{});return}
  s.api.reset();s.prompt.classList.remove('show');s.pp.innerHTML='';
  s.el.classList.add('intro');$('.ruler',s.el).style.setProperty('--rx',(10+Math.random()*70)+'%');
  sleep(1600,tk).then(()=>{s.el.classList.remove('intro');if(auto)return sleep(700,tk).then(()=>runDemo(s,tk));showPrompt(s,true)}).catch(()=>{});
}
async function runDemo(s,tk){
  if(!s.cur)s.cur=makeCursor(s.cv);
  const ctx={tok:tk,api:s.api,cur:s.cur,cv:s.cv,cap,wait:ms=>sleep(ms,tk),move:(x,y,ms)=>s.cur.move(x,y,ms,tk),pt:(el,fx,fy)=>ptOf(s.cv,el,fx,fy),
    callout:(a,b,t)=>{const w=callout(s.cv,a,b,t);live.push(w);return w},uncallout:w=>{live=live.filter(x=>x!==w);uncallout(w)}};
  try{await s.ch.demo(ctx);cap('');s.cur.hide();await typePrompt(s,tk);await sleep(2800,tk);if(auto&&tok===tk)go(curI+1)}
  catch(e){if(e!==STOP)console.error(e)}
}
function userTook(){if(!auto&&!tok)return;const s=slides[curI];if(!s.ch)return;auto=false;stop();s.el.classList.remove('intro');showPrompt(s,true);updUI()}
document.addEventListener('pointerdown',e=>{if(e.isTrusted&&e.target.closest&&e.target.closest('.slide.cur .frame'))userTook()},true);
document.addEventListener('wheel',e=>{if(e.target.closest&&e.target.closest('.slide.cur .frame'))userTook()},{capture:true,passive:true});
$('#bPrev').innerHTML=ic('chevl',16);$('#bNext').innerHTML=ic('chevr',16);
$('#bPrev').addEventListener('click',()=>go(curI-1));$('#bNext').addEventListener('click',()=>go(curI+1));
$('#bPlay').addEventListener('click',()=>{auto=!auto;updUI();const s=slides[curI];if(!auto){stop();if(s.ch){s.el.classList.remove('intro');showPrompt(s,true)}return}
  if(!s.ch)return go(curI);stop();s.api.reset();s.prompt.classList.remove('show');const tk=tok={dead:false};sleep(500,tk).then(()=>runDemo(s,tk)).catch(()=>{})});
document.addEventListener('keydown',e=>{const s=slides[curI];
  if(s.ch&&s.ch.n==='06'&&(e.key==='ArrowDown'||e.key==='ArrowUp')){e.preventDefault();userTook();s.api.key(e.key==='ArrowDown'?1:-1);return}
  if(s.ch&&s.ch.n==='06'&&e.key==='Escape'){s.api.close();return}
  if(e.key==='ArrowRight')go(curI+1);else if(e.key==='ArrowLeft')go(curI-1);else if(e.key===' '&&e.target===document.body){e.preventDefault();$('#bPlay').click()}});

/* ---------- background ---------- */
const bgc=$('#bgc');
function drawBg(){const d=Math.min(2,devicePixelRatio||1),w=innerWidth,h=innerHeight;bgc.width=w*d;bgc.height=h*d;const g=bgc.getContext('2d');g.setTransform(d,0,0,d,0,0);
  g.fillStyle='#232426';g.fillRect(0,0,w,h);
  [[.2,.25,.5,'rgba(52,53,56,.9)'],[.85,.6,.45,'rgba(14,15,16,.8)'],[.4,.85,.4,'rgba(40,41,44,.9)'],[.7,.15,.35,'rgba(20,21,23,.7)']].forEach(([x,y,r,c])=>{const gr=g.createRadialGradient(x*w,y*h,0,x*w,y*h,r*Math.max(w,h));gr.addColorStop(0,c);gr.addColorStop(1,'rgba(35,36,38,0)');g.fillStyle=gr;g.fillRect(0,0,w,h)});
  g.strokeStyle='rgba(255,255,255,.035)';g.lineWidth=1;
  [[.18,.3,7],[.78,.55,9],[.45,.9,6]].forEach(([cx,cy,n],q)=>{for(let k=1;k<=n;k++){g.beginPath();const R=k*Math.min(w,h)*.07;for(let a=0;a<=Math.PI*2+.01;a+=.05){const r=R*(1+.16*Math.sin(3*a+q+k*.3)+.08*Math.sin(5*a+k));const x=cx*w+Math.cos(a)*r,y=cy*h+Math.sin(a)*r*.8;a?g.lineTo(x,y):g.moveTo(x,y)}g.stroke()}});
  g.strokeStyle='rgba(255,255,255,.18)';[[.06,.42],[.5,.62],[.94,.3],[.3,.78]].forEach(([x,y])=>{g.beginPath();g.moveTo(x*w-5,y*h);g.lineTo(x*w+5,y*h);g.moveTo(x*w,y*h-5);g.lineTo(x*w,y*h+5);g.stroke()});
  g.fillStyle='#ff9500';g.beginPath();g.arc(.9*w,.66*h,1.6,0,7);g.fill()}
drawBg();addEventListener('resize',drawBg);
setInterval(()=>{$('#alt').textContent=`ALT ${2262+Math.round(Math.random()*12)} m`},900);

fitAll();updUI();
(document.fonts?document.fonts.ready:Promise.resolve()).then(fitAll);
go(0);
})();
</script>
